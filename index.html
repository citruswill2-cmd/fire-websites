<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I make websites</title>
  <meta name="theme-color" content="#0C0B0A" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #0C0B0A; color: #F4F0E8; font: 16px/1.4 system-ui, sans-serif; }
    main { max-width: 22rem; margin: 0 auto; padding: 2.5rem 1.25rem; }
    .star { color: #FF4D12; font-size: 1.25rem; }
    h1 { margin: .75rem 0 .25rem; font-size: 1.6rem; }
    p { color: #8A8378; margin-bottom: 1.5rem; }
    label { display: block; margin: 0 0 .9rem; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: #8A8378; }
    input, textarea, select, button { width: 100%; margin-top: .35rem; padding: .8rem .75rem; border: 1px solid #2A2724; border-radius: 8px; background: #161412; color: #F4F0E8; font: inherit; }
    textarea { min-height: 5rem; resize: vertical; }
    button { background: #FF4D12; color: #0C0B0A; font-weight: 600; border: 0; margin-top: .5rem; cursor: pointer; }
    #done { display: none; }
    #out { margin-top: 1rem; padding: .75rem; border: 1px solid #2A2724; background: #161412; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <div class="star">*</div>
    <h1>I make websites</h1>
    <p>Say what you want. I build it.</p>
    <form id="f">
      <label>Name <input required name="name" /></label>
      <label>Email <input required type="email" name="email" /></label>
      <label>What the site should do <textarea required name="wants" placeholder="Get calls. Sell stuff. Show work."></textarea></label>
      <label>Money
        <select name="budget">
          <option value="idk">idk</option>
          <option>cheap</option>
          <option>normal</option>
          <option>a lot</option>
        </select>
      </label>
      <button>Send</button>
    </form>
    <section id="done">
      <h1>Got it</h1>
      <p>I’ll hit you if I want the job.</p>
      <pre id="out"></pre>
    </section>
  </main>
  <script>
    const MAIL = "citruswill2@gmail.com";
    const f = document.getElementById("f");
    f.onsubmit = (e) => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      const text = "NAME: " + d.name + "\nEMAIL: " + d.email + "\nWANTS: " + d.wants + "\nMONEY: " + d.budget;
      f.style.display = "none";
      document.getElementById("done").style.display = "block";
      document.getElementById("out").textContent = text;
      location.href = "mailto:" + MAIL + "?subject=site&body=" + encodeURIComponent(text);
    };
  </script>
</body>
</html>
